# SonarCloud Configuration for Infernal Rise
sonar.projectKey=xBenja105_infernal-rise-web
sonar.organization=xbenja105

# Exclude binary assets, build distributions, and scratch testing scripts
sonar.exclusions=dist/**,build/**,assets/**,scratch/**

# Disable duplication detection on procedural level generation patterns
sonar.cpd.exclusions=**/*

# Ignore Math.random() false positives (used for videogame procedural level generation, not cryptography)
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2245
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*
